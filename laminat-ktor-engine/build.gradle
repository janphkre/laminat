plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

android {
    compileSdkVersion rootProject.ext.target_sdk_version
    defaultConfig {
        minSdkVersion rootProject.ext.min_sdk_version
        targetSdkVersion rootProject.ext.target_sdk_version
        versionCode rootProject.ext.pact_version_code
        versionName rootProject.ext.pact_version
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = rootProject.ext.library_namespace
            artifactId = 'laminat-ktor-engine'
            version = rootProject.ext.pact_version

            afterEvaluate {
                from components.release
            }
        }
    }
}


repositories {
    mavenCentral()
}

dependencies {
    implementation project(':laminat-core')
    implementation "io.ktor:ktor-client-core:$ktor_version"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    testImplementation "junit:junit:$test_junit_version"
    testImplementation "io.mockk:mockk:$test_mockk_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$test_coroutines_version"
}