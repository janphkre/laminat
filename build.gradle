// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext {
        pact_version = '3.6.0'
        pact_version_code = 20
        library_namespace = 'com.github.janphkre'

        min_sdk_version = 14
        target_sdk_version = 31
        kotlin_version = '1.9.22'
        gson_version = '2.9.0'
        apache_commons_version = '3.12.0'
        generex_version = '1.0.2'
        jsonpath_version = '0.6.4'

        mockserver_version = '4.12.0'

        //Testing:
        test_junit_version = '4.13.2'
        test_json_version = '20220320'
        test_mockito_version = '2.19.0'
        test_mockk_version = '1.12.8'
        test_hamcrest_version = '2.1'
        test_kotlintest_version = '2.0.7'

        ktlint_version = '10.2.0'

        //Retrofit-extension:
        retrofit_version = '2.11.0'
    }
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:$ktlint_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'org.jlleitschuh.gradle.ktlint'

    ktlint {
        version = "0.42.1" //version is taken from the ktlint idea plugin
        debug = false
        verbose = false
        android = true
        outputToConsole = true
        outputColorName = "RED"
        ignoreFailures = false
        filter {
            exclude("**/build/**")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
